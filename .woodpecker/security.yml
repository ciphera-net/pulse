# Continuous security scanning (OPS-7): gitleaks, trufflehog and Opengrep, all self-hosted.
#
# WHY A SEPARATE WORKFLOW FILE (not a step in test.yml / unit.yml): the k8s runner's per-pipeline
# workspace PVC is ReadWriteOnce (Exoscale has no RWX filesystem), so steps of ONE workflow
# serialize on that volume. A separate workflow gets its OWN workspace and runs IN PARALLEL with
# build/unit/integration — same reason unit.yml was split out (PULSE-307). Own GitHub check.
#
# 🔒 ONLY gitleaks GATES. gitleaks (--exit-code 1, .gitleaks.toml allowlists test fixtures) is the
# ONE step that can red the `security` check: a secret outside the allowlisted paths fails it.
# trufflehog and Opengrep are `failure: ignore`, so a finding OR a transient github blip in them never
# blocks a merge; their results are in this workflow's log. That is what makes `security` safe to
# REQUIRE in branch protection: merge is blocked iff a real secret is present.
#
# Nothing posts to the PR. The Aegis summary comment and the reviewdog review steps were removed on
# 02-11-2026: every new comment or review emailed the PR's author, and the summary's counts covered
# the whole repository, not the diff (Infra/docs/audits/02-11-2026-pr-bot-email-noise.md). All
# versions PINNED. Secrets scanners make NO network calls (trufflehog verification OFF); Opengrep
# egresses to github.com only (binary + rules). Tracked in Infra/docs/plans/08-10-2026-ci-security-scanning.md.
labels:
  runner: k8s

when:
  - event: push
    branch: [main]
  - event: pull_request

steps:
  # --- SECRETS, GATING: regex/entropy, no network. Scans the WORKING TREE (`dir`), not git history.
  # --config .gitleaks.toml (default rules + test-path allowlist) --exit-code 1 => a secret in
  # non-test code fails this step and reds the check. --redact keeps raw secrets out of the log.
  gitleaks:
    image: ghcr.io/gitleaks/gitleaks:v8.30.1
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 256Mi, cpu: 100m }
          limits: { memory: 512Mi }
    commands:
      - gitleaks dir . --config .gitleaks.toml --exit-code 1 --redact --verbose

  # --- SECRETS, ADVISORY: verified-credential detector run UNVERIFIED (--no-verification, no outbound
  # calls). failure:ignore — a finding or a blip never blocks. Its own "finished scanning" log line
  # carries the verified/unverified counts; the findings themselves (raw values) go to /dev/null, so
  # no candidate secret ever reaches the log.
  trufflehog:
    image: trufflesecurity/trufflehog:3.99.0
    failure: ignore
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 256Mi, cpu: 100m }
          limits: { memory: 1Gi }
    commands:
      - trufflehog filesystem . --no-verification --no-update --json > /dev/null

  # --- SAST, ADVISORY: Opengrep (LGPL OSS fork of semgrep). PINNED signed static binary on Alpine;
  # rules VENDORED at a pinned commit. failure:ignore — findings and download blips never block.
  # Findings and the "Ran N rules on M files: K findings" summary print to this log.
  opengrep:
    image: alpine:3.20
    failure: ignore
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 1Gi, cpu: 500m }
          limits: { memory: 2Gi }
    commands:
      - apk add --no-cache git curl ca-certificates >/dev/null
      - curl -fsSL -o /usr/local/bin/opengrep https://github.com/opengrep/opengrep/releases/download/v1.30.2/opengrep_musllinux_x86
      - chmod +x /usr/local/bin/opengrep
      - git clone --filter=blob:none -q https://github.com/opengrep/opengrep-rules /tmp/rules
      - git -C /tmp/rules checkout -q f1d2b562b414783763fd02a6ed2736eaed622efa
      - opengrep scan --config /tmp/rules/typescript --config /tmp/rules/javascript --config /tmp/rules/generic . || echo "opengrep exited nonzero (advisory; not blocking)"
