# Routes this workflow to the in-cluster Kubernetes agent, which advertises
# `!runner=k8s` — a MANDATORY label, so an agent is only eligible when the task
# asks for it.
#
# ════════════════════════════════════════════════════════════════════════════════
# BUILDER: rootless BuildKit, replacing kaniko (21-08-2026)
# ════════════════════════════════════════════════════════════════════════════════
# WHAT THIS USED TO BE. `woodpeckerci/plugin-kaniko:2.3.2`, with the build cache deliberately left OFF
# because kaniko's `cache-repo` semantics were unverified. Google ARCHIVED
# GoogleContainerTools/kaniko on 3 June 2025 — read-only, no CVE fixes — and the
# plugin we ran was three forks deep, based on an individual's Docker Hub
# namespace. Continuity, not speed, is why it is gone.
# Plan: Infra/docs/plans/20-08-2026-buildkit-rootless-migration.md
# As-built + measurements: Infra/docs/21-08-2026-buildkit-execution-record.md
#
# WHY BUILDKIT IS ALLOWED NOW WHEN plugin-docker-buildx WAS NOT (27-07-2026):
# buildx needs a PRIVILEGED step container, and on the Kubernetes backend the only
# route to that is repo-Trusted plus `privileged: true` in the step — i.e. exactly
# the self-elevation path that decision refused. This step needs NO privilege: it
# runs `buildctl`, a thin client that streams the build context to the SHARED
# daemon (`buildkitd` in the `buildkit` namespace) and streams logs back. All
# privilege lives in that daemon's manifest, which no committer can edit from here.
#
# ⚠️ THE DAEMON IS SHARED BY THE WHOLE ESTATE. A transport error here is an
# estate-wide problem, not a repo problem — check the `BuildkitdDown` alert first.
#
# 🔑 THE npm CREDENTIAL STILL GOES IN VIA `.npmrc-ci` AND A NON-FINAL STAGE.
# BuildKit supports `RUN --mount=type=secret`, which kaniko never did and which is
# the proper fix — but changing the Dockerfile in the SAME change as the builder
# swap would make a regression impossible to attribute. Separate follow-up.
# ⚠️ `.npmrc-ci` MUST NOT be added to .dockerignore — the builder needs it.
#
# 🔴 `next build` NOW RUNS INSIDE THE SHARED DAEMON, NOT IN THIS POD. That is why
# this step drops from 4Gi to 256Mi: the memory MOVED to buildkitd (4Gi request ==
# limit), it did not disappear. Measured 21-08-2026: one Next.js build takes the
# daemon from ~850Mi idle to ~2.4Gi. One fits comfortably; SEVERAL CONCURRENT ONES
# are the case to watch, and an OOM of the daemon kills every in-flight build in
# the estate, not just this one. `BuildkitdRestarting` fires on repeated OOM kills.
# ⇒ The structural fix is migration phase 4 — moving `next build` OUT of the
#   Dockerfile into an ordinary step, which takes the compile off the daemon
#   entirely. Until that lands, this is a known and monitored window.
#
# 🔑 THE CACHE LIVES IN EXOSCALE SOS, NOT IN THE REGISTRY, AND THAT IS DELIBERATE.
# `registry.ops.ciphera.net` still has NO garbage collection: it is execution-gated
# after the 29-06-2026 incident in which a tag-keyed GC deleted the blobs of 11 of
# 12 deployed images. A `mode=max` cache exports far more layers than kaniko ever
# would, so putting it there means unbounded growth or un-gating that GC first.
# ⚠️ Expiry is the `build-cache-prune` CronJob in the `buildkit` namespace, NOT an
# S3 lifecycle rule: SOS bucket lifecycle is Exoscale Early Access and is not
# enabled on this account — it accepts the PUT with HTTP 200 and stores nothing.
labels:
  runner: k8s


when:
  - event: push
    branch: main
  - event: push
    branch: staging

steps:
  write-npmrc:
    image: alpine:3.20
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 128Mi, cpu: 100m }
          limits: { memory: 512Mi }
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - printf '@ciphera-net:registry=https://npm.pkg.github.com/\n//npm.pkg.github.com/:_authToken=%s\nlegacy-peer-deps=true\n' "$NPM_TOKEN" > .npmrc-ci
  push:
    image: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
    # 🔑 Down from 4Gi request == 4Gi limit under kaniko — the compile moved into the shared daemon.
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 256Mi, cpu: 200m }
          limits: { memory: 768Mi }
    # NOTE: `extra_hosts` is GONE and its absence is correct. The Exoscale NLB
    # hairpin pin for registry.ops.ciphera.net moved to the DAEMON (hostAliases in
    # buildkitd.yaml) because the DAEMON performs the push — buildctl only hands it
    # the image name and forwards credentials over the session. Verified 21-08-2026
    # from inside the daemon: GET https://registry.ops.ciphera.net/v2/ -> HTTP 401.
    environment:
      BUILDKIT_HOST: tcp://buildkitd.buildkit.svc.cluster.local:1234
      CACHE_ENDPOINT: https://sos-ch-dk-2.exo.io
      CACHE_BUCKET: ciphera-build-cache
      CACHE_REGION: ch-dk-2
      CACHE_NAME: pulse-frontend
      REGISTRY: registry.ops.ciphera.net
      IMAGE_REPO: ciphera-net/pulse-frontend
      IMAGE_TAG: sha-${CI_COMMIT_SHA:0:7}
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
      NEXT_PUBLIC_API_URL:
        from_secret: next_public_api_url
      NEXT_PUBLIC_APP_URL:
        from_secret: next_public_app_url
      NEXT_PUBLIC_ID_URL:
        from_secret: next_public_id_url
      NEXT_PUBLIC_ID_API_URL:
        from_secret: next_public_id_api_url
      NEXT_PUBLIC_CAPTCHA_API_URL:
        from_secret: next_public_captcha_api_url
      NEXT_PUBLIC_CDN_URL:
        from_secret: next_public_cdn_url
      NEXT_PUBLIC_ASSET_PREFIX: https://ciphera-app-static.b-cdn.net/pulse
    when:
      - event: push
        branch: main
    commands:
      # 🔴 SOVEREIGNTY TRIPWIRE — see build.yml for the full reasoning.
      - |
        case "$CACHE_ENDPOINT" in
          https://sos-*.exo.io) echo "cache endpoint OK: $CACHE_ENDPOINT" ;;
          *) echo "REFUSING: cache endpoint '$CACHE_ENDPOINT' is not Exoscale SOS"; exit 1 ;;
        esac
      # buildctl reads the client's docker config and forwards the credential to the
      # daemon PER BUILD over the session. That is what keeps the registry push
      # credential subject to Woodpecker's per-repo trust and event gating — the
      # daemon holds no standing registry credential of its own, deliberately (its
      # Vault policy refuses kv/shared/ci-registry for exactly this reason).
      # `base64 | tr -d` rather than `base64 -w0`: this is BusyBox base64.
      - |
        mkdir -p /root/.docker
        AUTH=$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')
        printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY" "$AUTH" > /root/.docker/config.json
        chmod 600 /root/.docker/config.json
      # 🔑 A GREEN STEP PROVES THE CACHE WAS WRITTEN. A failed `--export-cache` is
      # FATAL, not a warning — `ignore-error` defaults to false and is not set.
      # Measured 21-08-2026 against a non-existent bucket: exit=1, "api error
      # NoSuchBucket". So there is no separate post-flight check: this step
      # succeeding IS the check, and the credential only works against SOS.
      #
      # The `name=` value carries a comma to publish two tags, so it must be QUOTED
      # INSIDE the CSV or buildctl reads `latest` as a separate attribute.
      - |
        buildctl build \
          --frontend dockerfile.v0 \
          --local context=. \
          --local dockerfile=. \
          --opt filename=Dockerfile \
          --opt build-arg:NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
          --opt build-arg:NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
          --opt build-arg:NEXT_PUBLIC_ID_URL="$NEXT_PUBLIC_ID_URL" \
          --opt build-arg:NEXT_PUBLIC_ID_API_URL="$NEXT_PUBLIC_ID_API_URL" \
          --opt build-arg:NEXT_PUBLIC_CAPTCHA_API_URL="$NEXT_PUBLIC_CAPTCHA_API_URL" \
          --opt build-arg:NEXT_PUBLIC_CDN_URL="$NEXT_PUBLIC_CDN_URL" \
          --opt build-arg:NEXT_PUBLIC_ASSET_PREFIX="$NEXT_PUBLIC_ASSET_PREFIX" \
          --import-cache "type=s3,region=$CACHE_REGION,bucket=$CACHE_BUCKET,endpoint_url=$CACHE_ENDPOINT,use_path_style=true,name=$CACHE_NAME" \
          --export-cache "type=s3,region=$CACHE_REGION,bucket=$CACHE_BUCKET,endpoint_url=$CACHE_ENDPOINT,use_path_style=true,name=$CACHE_NAME,mode=max" \
          --output "type=image,\"name=$REGISTRY/$IMAGE_REPO:$IMAGE_TAG,$REGISTRY/$IMAGE_REPO:latest\",push=true" \
          --progress plain
      - echo "pushed $REGISTRY/$IMAGE_REPO:$IMAGE_TAG and :latest"
  push-staging:
    image: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
    # 🔑 Down from 4Gi request == 4Gi limit under kaniko — the compile moved into the shared daemon.
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 256Mi, cpu: 200m }
          limits: { memory: 768Mi }
    # NOTE: `extra_hosts` is GONE and its absence is correct. The Exoscale NLB
    # hairpin pin for registry.ops.ciphera.net moved to the DAEMON (hostAliases in
    # buildkitd.yaml) because the DAEMON performs the push — buildctl only hands it
    # the image name and forwards credentials over the session. Verified 21-08-2026
    # from inside the daemon: GET https://registry.ops.ciphera.net/v2/ -> HTTP 401.
    environment:
      BUILDKIT_HOST: tcp://buildkitd.buildkit.svc.cluster.local:1234
      CACHE_ENDPOINT: https://sos-ch-dk-2.exo.io
      CACHE_BUCKET: ciphera-build-cache
      CACHE_REGION: ch-dk-2
      CACHE_NAME: pulse-frontend
      REGISTRY: registry.ops.ciphera.net
      IMAGE_REPO: ciphera-net/pulse-frontend-staging
      IMAGE_TAG: sha-${CI_COMMIT_SHA:0:7}
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
      NEXT_PUBLIC_API_URL:
        from_secret: staging_next_public_api_url
      NEXT_PUBLIC_APP_URL:
        from_secret: staging_next_public_app_url
      NEXT_PUBLIC_ID_URL:
        from_secret: staging_next_public_id_url
      NEXT_PUBLIC_ID_API_URL:
        from_secret: staging_next_public_id_api_url
      NEXT_PUBLIC_CAPTCHA_API_URL:
        from_secret: staging_next_public_captcha_api_url
      NEXT_PUBLIC_CDN_URL:
        from_secret: staging_next_public_cdn_url
      NEXT_PUBLIC_ASSET_PREFIX: https://ciphera-app-static.b-cdn.net/pulse-staging
    when:
      - event: push
        branch: staging
    commands:
      # 🔴 SOVEREIGNTY TRIPWIRE — see build.yml for the full reasoning.
      - |
        case "$CACHE_ENDPOINT" in
          https://sos-*.exo.io) echo "cache endpoint OK: $CACHE_ENDPOINT" ;;
          *) echo "REFUSING: cache endpoint '$CACHE_ENDPOINT' is not Exoscale SOS"; exit 1 ;;
        esac
      # buildctl reads the client's docker config and forwards the credential to the
      # daemon PER BUILD over the session. That is what keeps the registry push
      # credential subject to Woodpecker's per-repo trust and event gating — the
      # daemon holds no standing registry credential of its own, deliberately (its
      # Vault policy refuses kv/shared/ci-registry for exactly this reason).
      # `base64 | tr -d` rather than `base64 -w0`: this is BusyBox base64.
      - |
        mkdir -p /root/.docker
        AUTH=$(printf '%s:%s' "$REGISTRY_USERNAME" "$REGISTRY_PASSWORD" | base64 | tr -d '\n')
        printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$REGISTRY" "$AUTH" > /root/.docker/config.json
        chmod 600 /root/.docker/config.json
      # 🔑 A GREEN STEP PROVES THE CACHE WAS WRITTEN. A failed `--export-cache` is
      # FATAL, not a warning — `ignore-error` defaults to false and is not set.
      # Measured 21-08-2026 against a non-existent bucket: exit=1, "api error
      # NoSuchBucket". So there is no separate post-flight check: this step
      # succeeding IS the check, and the credential only works against SOS.
      #
      # The `name=` value carries a comma to publish two tags, so it must be QUOTED
      # INSIDE the CSV or buildctl reads `latest` as a separate attribute.
      - |
        buildctl build \
          --frontend dockerfile.v0 \
          --local context=. \
          --local dockerfile=. \
          --opt filename=Dockerfile \
          --opt build-arg:NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" \
          --opt build-arg:NEXT_PUBLIC_APP_URL="$NEXT_PUBLIC_APP_URL" \
          --opt build-arg:NEXT_PUBLIC_ID_URL="$NEXT_PUBLIC_ID_URL" \
          --opt build-arg:NEXT_PUBLIC_ID_API_URL="$NEXT_PUBLIC_ID_API_URL" \
          --opt build-arg:NEXT_PUBLIC_CAPTCHA_API_URL="$NEXT_PUBLIC_CAPTCHA_API_URL" \
          --opt build-arg:NEXT_PUBLIC_CDN_URL="$NEXT_PUBLIC_CDN_URL" \
          --opt build-arg:NEXT_PUBLIC_ASSET_PREFIX="$NEXT_PUBLIC_ASSET_PREFIX" \
          --import-cache "type=s3,region=$CACHE_REGION,bucket=$CACHE_BUCKET,endpoint_url=$CACHE_ENDPOINT,use_path_style=true,name=$CACHE_NAME" \
          --export-cache "type=s3,region=$CACHE_REGION,bucket=$CACHE_BUCKET,endpoint_url=$CACHE_ENDPOINT,use_path_style=true,name=$CACHE_NAME,mode=max" \
          --output "type=image,\"name=$REGISTRY/$IMAGE_REPO:$IMAGE_TAG,$REGISTRY/$IMAGE_REPO:latest\",push=true" \
          --progress plain
      - echo "pushed $REGISTRY/$IMAGE_REPO:$IMAGE_TAG and :latest"
