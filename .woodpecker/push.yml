    backend_options:
      kubernetes:
        resources:
          requests:
            memory: 4Gi
          limits:
            memory: 4Gi
    settings:
      # `extra_opts: --compressed-caching=false` REMOVED 27-07-2026 with the move to
      # 4 x standard.large. kaniko holds every layer COMPRESSED IN MEMORY while
      # snapshotting, on top of the build's own usage; on a 3411 MiB node that took
      # this step to 2960 MiB and killed it at `COPY --from=deps /app/node_modules`
      # — in kaniko's snapshot phase, not in `next build`. Disabling compressed
      # caching made kaniko stream layers instead: it fit, and it COST BUILD TIME.
      # That was a workaround for the node size, and the node size is now fixed —
