# Routes this workflow to the in-cluster Kubernetes agent, which advertises
# `!runner=k8s` — a MANDATORY label, so an agent is only eligible when the task
# asks for it. Deleting this line sends the workflow back to the ci-ops Docker
# agent; that is the rollback, and it is one line.
#
# buildx needs a PRIVILEGED container, and WOODPECKER_PLUGINS_PRIVILEGED — the
# server-side grant that made that safe on Nomad — is a NO-OP on the Kubernetes
# backend (woodpecker-ci/woodpecker#6484). kaniko builds rootless instead, so no
# step needs privilege at all.
labels:
  runner: k8s

when:
  - event: push
    branch: main
  - event: push
    branch: staging

steps:
  write-npmrc:
    image: alpine:3.20
    environment:
      NPM_TOKEN:
        from_secret: npm_token
    commands:
      - printf '@ciphera-net:registry=https://npm.pkg.github.com/\n//npm.pkg.github.com/:_authToken=%s\nlegacy-peer-deps=true\n' "$NPM_TOKEN" > .npmrc-ci

  build:
    image: woodpeckerci/plugin-kaniko:2.3.2@sha256:01e0e325efd8fd2b1a95d207e84780a85ed7f8eb9712d8e79888e0f42ff8b7b3
    when:
      - event: push
        branch: main
    environment:
      NEXT_PUBLIC_API_URL:
        from_secret: next_public_api_url
      NEXT_PUBLIC_APP_URL:
        from_secret: next_public_app_url
      NEXT_PUBLIC_ID_URL:
        from_secret: next_public_id_url
      NEXT_PUBLIC_ID_API_URL:
        from_secret: next_public_id_api_url
      NEXT_PUBLIC_CAPTCHA_API_URL:
        from_secret: next_public_captcha_api_url
      NEXT_PUBLIC_CHARGEBEE_SITE:
        from_secret: next_public_chargebee_site
      NEXT_PUBLIC_CHARGEBEE_PUBLISHABLE_KEY:
        from_secret: next_public_chargebee_publishable_key
      NEXT_PUBLIC_CDN_URL:
        from_secret: next_public_cdn_url
    # 🔴 THIS STEP OVERRIDES THE NAMESPACE DEFAULT, AND ONLY THIS STEP.
    #
    # woodpecker-builds carries a LimitRange of request==limit==1536Mi, which is
    # what stops any build overcommitting a 3411 MiB node. This build genuinely
    # does not fit in it, measured three ways on 27-07-2026:
    #   heap 1280, ceiling 1536Mi -> killed at the ceiling
    #   heap  896, ceiling 1536Mi -> V8 "heap out of memory" at ~900 MB, RSS 1401 MiB
    #   heap 1280, ceiling 2Gi    -> killed at the ceiling, RSS 2048 MiB
    # Raising the heap 896->1280 (+384 MB) raised RSS by +647 MB: V8 expands to
    # fill what it is allowed, and this pod holds kaniko AND the node process. No
    # heap setting both completes the build and fits under 2 GiB, so the ceiling
    # has to be 3Gi. Nodes are 3411 MiB allocatable, so this build needs a nearly
    # EMPTY node — the autoscaler adds one for the duration and removes it after.
    # Owner informed 27-07-2026; the cheaper "cap it to fit 5 nodes" option was
    # tried first and does not exist.
    # It is the largest build in the estate (biggest node_modules, Next.js +
    # webpack + PWA compile).
    #
    # request == limit here too: the point of the namespace default is that the
    # scheduler's arithmetic bounds the node, and an override that only raised the
    # limit would reintroduce exactly the overcommit that took a node down twice.
    # Raise the DEFAULT for everyone and every node loses that guarantee; raise it
    # HERE and only this build is expensive.
    backend_options:
      kubernetes:
        resources:
          requests:
            memory: 3Gi
          limits:
            memory: 3Gi
    settings:
      # 🔴 kaniko holds every layer COMPRESSED IN MEMORY while snapshotting, on top
      # of the build's own usage. This repo has the largest node_modules in the
      # estate, and the step died at `COPY --from=deps /app/node_modules` — in
      # kaniko's snapshot phase, not in `next build`. Measured 27-07-2026: 2960 MiB
      # working set against 3411 MiB of node allocatable.
      # --compressed-caching=false makes kaniko stream layers instead of holding
      # compressed copies resident. Slower, and the only thing that fits this build
      # inside the 1536Mi request==limit every woodpecker-builds pod now carries.
      extra_opts: --compressed-caching=false
      dry-run: true
      registry: registry.ops.ciphera.net
      repo: ciphera-net/pulse-frontend
      tags:
        - shadow-${CI_COMMIT_SHA:0:7}
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
      # buildx's registry cache is not ported: kaniko's `cache`/`cache-repo`
      # semantics are unverified here and guessing silently creates a junk
      # repository. Slower build, not a wrong one.
      # `secrets:` removed — kaniko has no BuildKit --secret. The npm
      # credential is COPY'd into a NON-FINAL Dockerfile stage instead, so it
      # never reaches the published image. See the Dockerfile.
      # kaniko takes build args from the step ENVIRONMENT (see the
      # `environment:` block above) rather than an inline map, which keeps
      # the `from_secret` indirection instead of inlining secret values.
      build-args-from-env:
        - NEXT_PUBLIC_API_URL
        - NEXT_PUBLIC_APP_URL
        - NEXT_PUBLIC_ID_URL
        - NEXT_PUBLIC_ID_API_URL
        - NEXT_PUBLIC_CAPTCHA_API_URL
        - NEXT_PUBLIC_CHARGEBEE_SITE
        - NEXT_PUBLIC_CHARGEBEE_PUBLISHABLE_KEY
        - NEXT_PUBLIC_CDN_URL

  build-staging:
    image: woodpeckerci/plugin-kaniko:2.3.2@sha256:01e0e325efd8fd2b1a95d207e84780a85ed7f8eb9712d8e79888e0f42ff8b7b3
    when:
      - event: push
        branch: staging
    environment:
      NEXT_PUBLIC_API_URL:
        from_secret: staging_next_public_api_url
      NEXT_PUBLIC_APP_URL:
        from_secret: staging_next_public_app_url
      NEXT_PUBLIC_ID_URL:
        from_secret: staging_next_public_id_url
      NEXT_PUBLIC_ID_API_URL:
        from_secret: staging_next_public_id_api_url
      NEXT_PUBLIC_CAPTCHA_API_URL:
        from_secret: staging_next_public_captcha_api_url
      NEXT_PUBLIC_CHARGEBEE_SITE:
        from_secret: staging_next_public_chargebee_site
      NEXT_PUBLIC_CHARGEBEE_PUBLISHABLE_KEY:
        from_secret: staging_next_public_chargebee_publishable_key
      NEXT_PUBLIC_CDN_URL:
        from_secret: staging_next_public_cdn_url
    # 🔴 THIS STEP OVERRIDES THE NAMESPACE DEFAULT, AND ONLY THIS STEP.
    #
    # woodpecker-builds carries a LimitRange of request==limit==1536Mi, which is
    # what stops any build overcommitting a 3411 MiB node. This build genuinely
    # does not fit in it, measured three ways on 27-07-2026:
    #   heap 1280, ceiling 1536Mi -> killed at the ceiling
    #   heap  896, ceiling 1536Mi -> V8 "heap out of memory" at ~900 MB, RSS 1401 MiB
    #   heap 1280, ceiling 2Gi    -> killed at the ceiling, RSS 2048 MiB
    # Raising the heap 896->1280 (+384 MB) raised RSS by +647 MB: V8 expands to
    # fill what it is allowed, and this pod holds kaniko AND the node process. No
    # heap setting both completes the build and fits under 2 GiB, so the ceiling
    # has to be 3Gi. Nodes are 3411 MiB allocatable, so this build needs a nearly
    # EMPTY node — the autoscaler adds one for the duration and removes it after.
    # Owner informed 27-07-2026; the cheaper "cap it to fit 5 nodes" option was
    # tried first and does not exist.
    # It is the largest build in the estate (biggest node_modules, Next.js +
    # webpack + PWA compile).
    #
    # request == limit here too: the point of the namespace default is that the
    # scheduler's arithmetic bounds the node, and an override that only raised the
    # limit would reintroduce exactly the overcommit that took a node down twice.
    # Raise the DEFAULT for everyone and every node loses that guarantee; raise it
    # HERE and only this build is expensive.
    backend_options:
      kubernetes:
        resources:
          requests:
            memory: 3Gi
          limits:
            memory: 3Gi
    settings:
      # 🔴 kaniko holds every layer COMPRESSED IN MEMORY while snapshotting, on top
      # of the build's own usage. This repo has the largest node_modules in the
      # estate, and the step died at `COPY --from=deps /app/node_modules` — in
      # kaniko's snapshot phase, not in `next build`. Measured 27-07-2026: 2960 MiB
      # working set against 3411 MiB of node allocatable.
      # --compressed-caching=false makes kaniko stream layers instead of holding
      # compressed copies resident. Slower, and the only thing that fits this build
      # inside the 1536Mi request==limit every woodpecker-builds pod now carries.
      extra_opts: --compressed-caching=false
      dry-run: true
      registry: registry.ops.ciphera.net
      repo: ciphera-net/pulse-frontend-staging
      tags:
        - shadow-staging-${CI_COMMIT_SHA:0:7}
      username:
        from_secret: registry_username
      password:
        from_secret: registry_password
      # buildx's registry cache is not ported: kaniko's `cache`/`cache-repo`
      # semantics are unverified here and guessing silently creates a junk
      # repository. Slower build, not a wrong one.
      # `secrets:` removed — kaniko has no BuildKit --secret. The npm
      # credential is COPY'd into a NON-FINAL Dockerfile stage instead, so it
      # never reaches the published image. See the Dockerfile.
      # kaniko takes build args from the step ENVIRONMENT (see the
      # `environment:` block above) rather than an inline map, which keeps
      # the `from_secret` indirection instead of inlining secret values.
      build-args-from-env:
        - NEXT_PUBLIC_API_URL
        - NEXT_PUBLIC_APP_URL
        - NEXT_PUBLIC_ID_URL
        - NEXT_PUBLIC_ID_API_URL
        - NEXT_PUBLIC_CAPTCHA_API_URL
        - NEXT_PUBLIC_CHARGEBEE_SITE
        - NEXT_PUBLIC_CHARGEBEE_PUBLISHABLE_KEY
        - NEXT_PUBLIC_CDN_URL
