      KUBE_API: https://kubernetes.default.svc
    commands:
      - apk add --no-cache curl jq >/dev/null
      - |
        DIGEST=$(cat /woodpecker/digest) || { echo "digest handoff missing"; exit 1; }
        DEPLOY_SHA=$(cat /woodpecker/deploy_sha) || { echo "deploy_sha handoff missing"; exit 1; }
        case "$DIGEST" in sha256:*) ;; *) echo "bad digest handoff [$DIGEST]"; exit 1 ;; esac
        [ -n "$DEPLOY_SHA" ] || { echo "empty deploy_sha handoff"; exit 1; }
        export DIGEST DEPLOY_SHA
      - |
        BODY=$(jq -nc \
          --arg img "registry.ops.ciphera.net/ciphera-net/pulse-frontend-staging@$DIGEST" \
          --arg sha "$DEPLOY_SHA" \
          '{spec:{template:{metadata:{annotations:{"ciphera.net/deploy-sha":$sha}},
                            spec:{containers:[{name:"nextjs",image:$img}]}}}}')
        curl -fsS --max-time 30 --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt -X PATCH \
          -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
          -H "Content-Type: application/strategic-merge-patch+json" \
          -d "$BODY" \
          "$KUBE_API/apis/apps/v1/namespaces/apps/deployments/pulse-frontend-staging?fieldManager=woodpecker-ci" >/dev/null
      # Convergence gate. status.replicas == updatedReplicas is the load-bearing clause:
      # availableReplicas sums across ALL ReplicaSets, so without it the gate passes while
      # an OLD pod is still serving and purge-cdn caches that build's 404s for 30 days.
      - |
        CONVERGED=no
        for i in $(seq 1 90); do
          S=$(curl -fsS --max-time 15 --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
            -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
            "$KUBE_API/apis/apps/v1/namespaces/apps/deployments/pulse-frontend-staging") \
            || { echo "api read failed (iter $i) — retrying"; S=''; }
          echo "$S" | jq -e '
            ((.status.observedGeneration // 0) >= .metadata.generation)
            and ((.status.updatedReplicas // 0) == .spec.replicas)
            and ((.status.replicas // 0) == (.status.updatedReplicas // 0))
            and ((.status.availableReplicas // 0) == (.status.updatedReplicas // 0))' >/dev/null \
            && { echo "k8s rollout converged"; CONVERGED=yes; break; }
          echo "$S" | jq -e '.status.conditions[]? | select(.type=="Progressing" and .reason=="ProgressDeadlineExceeded")' >/dev/null \
            && { echo "k8s rollout FAILED (ProgressDeadlineExceeded)"; break; }
          sleep 4
        done
        if [ "$CONVERGED" != "yes" ]; then
          curl -fsS --max-time 15 --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
            -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
            "$KUBE_API/api/v1/namespaces/apps/pods" \
            | jq -r '.items[] | select(.metadata.name | startswith("pulse-frontend-staging")) | "\(.metadata.name) \(.status.phase)"' || true
          echo "k8s rollout did NOT converge for pulse-frontend-staging"
          exit 1
        fi
      - |
        O=$(curl -fsS --max-time 15 --retry 3 --retry-all-errors --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
          -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
          "$KUBE_API/apis/apps/v1/namespaces/apps/deployments/pulse-frontend-staging")
        echo "$O" | jq -e \
          --arg img "registry.ops.ciphera.net/ciphera-net/pulse-frontend-staging@$DIGEST" \
          --arg sha "$DEPLOY_SHA" '
          ([.spec.template.spec.containers[].name] == ["nextjs"])
          and ((.spec.template.spec.containers[] | select(.name=="nextjs") | .image) == $img)
          and (.spec.template.metadata.annotations["ciphera.net/deploy-sha"] == $sha)' >/dev/null \
          || { echo "POST-DEPLOY MISMATCH — running spec is not what we shipped:"; \
               echo "$O" | jq '{containers:[.spec.template.spec.containers[]|{name,image}], sha:.spec.template.metadata.annotations["ciphera.net/deploy-sha"]}'; exit 1; }
      - echo "Deployed pulse-frontend-staging to SKS ($DEPLOY_SHA)"
  # Purge AFTER the CLUSTER rollout converges (deploy-k8s asserts only the new ReplicaSet
  # is serving). Purging mid-rollout re-caches the old build's 404s for the new chunk
  # paths under a 30-day max-age — exactly what blanked pulse-staging on 22-07-2026.
  purge-cdn:
    image: alpine:3.20
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 128Mi, cpu: 100m }
          limits: { memory: 512Mi }
    depends_on: [deploy-k8s]
    when:
      - event: push
        branch: main
    environment:
      BUNNY_API_KEY:
        from_secret: bunny_api_key
    commands:
      - apk add --no-cache curl >/dev/null
      # ⚠️ `/_next/static/*` IS NO LONGER PURGED (18-08-2026). Since assetPrefix those
      # chunks are not served from this hostname at all — they live in their own zone
      # (ciphera-app-static), and RETAINING EVERY BUILD'S OUTPUT IS THE ENTIRE POINT.
      # Purging them here would be a no-op today; re-adding a purge against the asset
      # zone would reintroduce exactly the blanking failure this change removes.
      # ═══ HTML PURGE — REQUIRED SINCE 13-08-2026, NOT AN OPTIMISATION ═══
      # Public marketing HTML is now edge-cached at 300s (Bunny zone 5440585, rule
      # "HTML edge caching 300s — EXPLICIT PATH ALLOWLIST"). Purging only
      # /_next/static/* would leave up to five minutes of STALE HTML referencing
      # chunk hashes this deploy just evicted — the blanking failure that hit
      # pulse-staging on 22-07-2026, now reachable on production too.
      #
      # 🔴 THIS LIST AND THE EDGE RULE'S ALLOWLIST ARE ONE THING IN TWO PLACES.
      # Add a path to the rule and it stays stale for 300s after every deploy until
      # it is added here. Remove one here and it silently rots. They were verified
      # in step on 13-08-2026; check both when either changes.
      #
      # '/' is ABSENT on purpose and is not an oversight: it is not edge-cached,
      # because middleware.ts:86 redirects signed-in visitors to /sites and Bunny's
      # cache key ignores cookies, so a logged-in request can cache a 307 that
      # bounces every anonymous visitor off the marketing homepage. Reproduced live.
      # If '/' ever becomes cacheable, add it here in the same change.
      #
      # Deliberately NOT a single /* wildcard: images and fonts on this zone carry a
      # 30-day TTL and are purged by nothing today, so evicting them every deploy
      # would be a miss stampede against the origin.
      - |
        FAILED=""
        for P in "/pricing*" "/features*" "/demo*" "/faq*" "/about*" "/installation*" \
                 "/changelog*" "/integrations*" "/vs/*" "/tools/*"; do
          curl -fsS --max-time 300 --retry 3 --retry-delay 10 --retry-all-errors -X POST \
            "https://api.bunny.net/purge?url=https://pulse.ciphera.net$P&async=false" \
            -H "AccessKey: $BUNNY_API_KEY" >/dev/null \
            && echo "  purged $P" \
            || FAILED="$FAILED $P"
        done
        if [ -n "$FAILED" ]; then
          echo "DEPLOY SHIPPED; HTML PURGE FAILED for:$FAILED — re-run the purge only, do NOT re-deploy"
          exit 1
        fi
      - echo "Purged pulse.ciphera.net cached HTML (10 patterns)"
      # ═══ 🔴 ASSERT THE PREFIX ACTUALLY SHIPPED ═══
      # next.config.ts defaults NEXT_PUBLIC_ASSET_PREFIX to EMPTY, so a missing build arg
      # degrades safely to same-origin assets instead of 404ing every chunk. The cost of
      # that safe default is that the protection can be silently OFF — so it is ASSERTED
      # here against the LIVE HTML rather than trusted. A feature that fails open needs a
      # positive check; this is the same lesson as LIGHTHOUSE_RUNNER_URL being unset.
      # Runs last, after the HTML purge, so what it reads is this build's markup.
      - |
        HTML=$(curl -fsS --max-time 30 --retry 3 --retry-all-errors "https://pulse.ciphera.net/login") \
          || { echo "FAIL: could not fetch https://pulse.ciphera.net/login to verify assetPrefix"; exit 1; }
        case "$HTML" in
          *"https://ciphera-app-static.b-cdn.net/pulse/_next/static"*)
            echo "assetPrefix verified live: chunks come from https://ciphera-app-static.b-cdn.net/pulse" ;;
          *)
            echo "🔴 DEPLOY SHIPPED BUT assetPrefix IS NOT IN THE LIVE HTML."
            echo "🔴 Chunks are served from the app itself, so the version-coupling protection"
            echo "🔴 that gates the Magic Containers migration is OFF."
            echo "🔴 Check NEXT_PUBLIC_ASSET_PREFIX reached the BuildKit build:"
            echo "🔴   .woodpecker/push.yml -> the buildctl line MUST carry"
            echo "🔴   --opt build-arg:NEXT_PUBLIC_ASSET_PREFIX=\$NEXT_PUBLIC_ASSET_PREFIX,"
            echo "🔴   or the environment: entry above it is INERT."
            echo "🔴   (This said settings.build-args-from-env until 21-08-2026, which was"
            echo "🔴    the kaniko plugin setting and no longer exists.)"
            echo "🔴 Then confirm the Dockerfile declares the matching ARG."
            echo "🔴 NOTE: build.yml no longer exists on this branch (deleted 20-08-2026);"
            echo "🔴 push.yml is the ONLY place a build arg can reach the shipped image."
            exit 1 ;;
        esac

  # Purge AFTER the CLUSTER rollout converges (deploy-k8s asserts only the new ReplicaSet
  # is serving). Purging mid-rollout re-caches the old build's 404s for the new chunk
  # paths under a 30-day max-age — exactly what blanked pulse-staging on 22-07-2026.
  purge-cdn-staging:
    image: alpine:3.20
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 128Mi, cpu: 100m }
          limits: { memory: 512Mi }
    depends_on: [deploy-k8s-staging]
    when:
      - event: push
        branch: staging
    environment:
      BUNNY_API_KEY:
        from_secret: bunny_api_key
    commands:
      - apk add --no-cache curl >/dev/null
      # ⚠️ `/_next/static/*` IS NO LONGER PURGED (18-08-2026). Since assetPrefix those
      # chunks are not served from this hostname at all — they live in their own zone
      # (ciphera-app-static), and RETAINING EVERY BUILD'S OUTPUT IS THE ENTIRE POINT.
      # Purging them here would be a no-op today; re-adding a purge against the asset
      # zone would reintroduce exactly the blanking failure this change removes.
      # HTML purge — staging mirrors production exactly (zone 5440501). Keeping the
      # two lists identical is the point: staging can only rehearse a production
      # deploy if it carries production's caching rules AND production's purge set.
      # See the production step above for why '/' is absent.
      - |
        FAILED=""
        for P in "/pricing*" "/features*" "/demo*" "/faq*" "/about*" "/installation*" \
                 "/changelog*" "/integrations*" "/vs/*" "/tools/*"; do
          curl -fsS --max-time 300 --retry 3 --retry-delay 10 --retry-all-errors -X POST \
            "https://api.bunny.net/purge?url=https://pulse-staging.ciphera.net$P&async=false" \
            -H "AccessKey: $BUNNY_API_KEY" >/dev/null \
            && echo "  purged $P" \
            || FAILED="$FAILED $P"
        done
        if [ -n "$FAILED" ]; then
          echo "DEPLOY SHIPPED; HTML PURGE FAILED for:$FAILED — re-run the purge only, do NOT re-deploy"
          exit 1
        fi
      - echo "Purged pulse-staging.ciphera.net cached HTML (10 patterns)"
      # ═══ 🔴 ASSERT THE PREFIX ACTUALLY SHIPPED ═══
      # next.config.ts defaults NEXT_PUBLIC_ASSET_PREFIX to EMPTY, so a missing build arg
      # degrades safely to same-origin assets instead of 404ing every chunk. The cost of
      # that safe default is that the protection can be silently OFF — so it is ASSERTED
      # here against the LIVE HTML rather than trusted. A feature that fails open needs a
      # positive check; this is the same lesson as LIGHTHOUSE_RUNNER_URL being unset.
      # Runs last, after the HTML purge, so what it reads is this build's markup.
      - |
        HTML=$(curl -fsS --max-time 30 --retry 3 --retry-all-errors "https://pulse-staging.ciphera.net/login") \
          || { echo "FAIL: could not fetch https://pulse-staging.ciphera.net/login to verify assetPrefix"; exit 1; }
        case "$HTML" in
          *"https://ciphera-app-static.b-cdn.net/pulse-staging/_next/static"*)
            echo "assetPrefix verified live: chunks come from https://ciphera-app-static.b-cdn.net/pulse-staging" ;;
          *)
            echo "🔴 DEPLOY SHIPPED BUT assetPrefix IS NOT IN THE LIVE HTML."
            echo "🔴 Chunks are served from the app itself, so the version-coupling protection"
            echo "🔴 that gates the Magic Containers migration is OFF."
            echo "🔴 Check NEXT_PUBLIC_ASSET_PREFIX reached the BuildKit build:"
            echo "🔴   .woodpecker/push.yml -> the buildctl line MUST carry"
            echo "🔴   --opt build-arg:NEXT_PUBLIC_ASSET_PREFIX=\$NEXT_PUBLIC_ASSET_PREFIX,"
            echo "🔴   or the environment: entry above it is INERT."
            echo "🔴   (This said settings.build-args-from-env until 21-08-2026, which was"
            echo "🔴    the kaniko plugin setting and no longer exists.)"
            echo "🔴 Then confirm the Dockerfile declares the matching ARG."
            echo "🔴 NOTE: build.yml no longer exists on this branch (deleted 20-08-2026);"
            echo "🔴 push.yml is the ONLY place a build arg can reach the shipped image."
            exit 1 ;;
        esac

  cdn-scripts:
    image: alpine:3.20
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 128Mi, cpu: 100m }
          limits: { memory: 512Mi }
    when:
      - event: push
        branch: main
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: exoscale_cdn_scripts_key
      AWS_SECRET_ACCESS_KEY:
        from_secret: exoscale_cdn_scripts_secret
      AWS_DEFAULT_REGION: ch-dk-2
      BUNNY_API_KEY:
        from_secret: bunny_api_key
      BUNNY_STORAGE_PASSWORD:
        from_secret: bunny_storage_scripts_password
    commands:
      - apk add --no-cache aws-cli curl openssl >/dev/null
      - |
        echo -n '{' > public/script-sri.json
        first=true
        for file in script.js; do
          [ -f "public/$file" ] || continue
          hash=$(openssl dgst -sha384 -binary "public/$file" | openssl base64 -A)
          $first || echo -n ',' >> public/script-sri.json
          echo -n "\"$file\":\"sha384-$hash\"" >> public/script-sri.json
          first=false
        done
        echo '}' >> public/script-sri.json
        cat public/script-sri.json
      # Primary origin: Bunny Edge Storage (js.ciphera.net reads from the ciphera-cdn-scripts zone).
      - |
      # Backup origin: Exoscale SOS (write-through durability copy).
      # ⚠️ FIXED 25-07-2026 — THIS UPLOADED ONLY TO A BUCKET NOBODY SERVES.
      # js.ciphera.net is Bunny pull zone 5736065, which has an EMPTY OriginUrl and
      # StorageZoneId 1688531: it serves from BUNNY STORAGE (zone ciphera-cdn-scripts),
      # NOT from Exoscale SOS. Writing only to SOS and then purging meant the purge
      # re-fetched the same unchanged object out of Bunny Storage — the upload never
      # reached production.
      # It stayed hidden because the 24-07-2026 CDN migration bulk-copied SOS into Bunny
      # Storage (every object there carries LastChanged 2026-07-24T17:23:20) and no script
      # has changed since, so the two are byte-identical today. Only the NEXT script change
      # would have silently failed to ship.
      # Bunny Storage is PRIMARY and SOS the BACKUP leg — the same split
      # scripts/cdn-env.sh already documents for the assets zone. Primary goes first and
      # uses -f so a failure fails the step LOUDLY rather than leaving production stale.
      # ⚠️ If the Bunny leg 401s, `bunny_storage_scripts_password` holds the wrong value:
      # the working storage password is the one in CDNZ_SCRIPTS_PASSWORD (verified against
      # storage.bunnycdn.com on 25-07-2026); the .env twin named
      # BUNNY_STORAGE_SCRIPTS_PASSWORD returns 401.
      - |
        for file in script.js script-sri.json; do
          [ -f "public/$file" ] || continue
          ct="application/javascript"
          [ "$file" = "script-sri.json" ] && ct="application/json"
          curl -fsS --max-time 120 -X PUT \
            -H "AccessKey: $BUNNY_STORAGE_PASSWORD" \
            -H "Content-Type: $ct" \
            --data-binary "@public/$file" \
            "https://storage.bunnycdn.com/ciphera-cdn-scripts/$file" >/dev/null \
            || { echo "PRIMARY (Bunny Storage) upload FAILED for $file — production would stay stale"; exit 1; }
          aws s3 cp "public/$file" "s3://ciphera-scripts/$file" \
            --endpoint-url https://sos-ch-dk-2.exo.io \
            --content-type "$ct" \
            --cache-control "public, max-age=7200" \
            --acl public-read \
            --quiet
        done
        echo "Scripts uploaded to Bunny Storage (primary) + SOS (backup)"
      # geo-replicas sync asynchronously; purging early can re-cache a stale replica copy for the full TTL
      - sleep 30
      - |
        for path in script.js script-sri.json; do
          curl -fsS -X POST \
            "https://api.bunny.net/purge?url=https://js.ciphera.net/$path&async=false" \
            -H "AccessKey: $BUNNY_API_KEY"
        done
        echo "CDN cache purged"
