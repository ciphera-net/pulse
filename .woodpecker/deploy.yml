# Cluster-only deploy: SKS. Both branches (main -> prod, staging -> the staging pair).
# Originally generated from
# Infra/Kubernetes/workloads/_shared/ci-deploy/deploy.yml.template.
#
# BOTH deploy-nomad steps were REMOVED 25-07-2026 — the prod one and the staging one —
# ending the Phase-2 parallel run for this service. They had to come out BEFORE the Nomad
# jobs were stopped: a stopped-but-unpurged job still answers GET /v1/job/<id>, so the next
# deploy would have re-registered and resurrected it. Note there were TWO of them here; a
# sweep matching only the exact step name `deploy-nomad` would have left the staging half
# behind, and pulse-frontend-staging writes against the SHARED PRODUCTION database.
#
# Rolling back now means re-registering the captured job JSON from
# Infra/Kubernetes/workloads/_shared/ci-deploy/decommission/wave23-snapshot/ and flipping
# the Bunny origin back, then purging — Nomad garbage-collects stopped job definitions, so
# a stopped job is NOT a warm standby, and reverting an origin evicts nothing on its own
# (30-day max-age on /_next/static).
#
# ⚠️ WHY THIS CHANGED: all four pulse Bunny zones now point at the SKS cluster. While this
# pipeline deployed only to Nomad, a push updated a job serving ZERO public traffic and
# then purged the edge, which re-filled from the CLUSTER origin running the OLD image — a
# green pipeline that shipped nothing.
#
# ⚠️ PURGE NOW GATES ON THE CLUSTER ROLLOUT, not the Nomad one. Purging while the origin
# is half old / half new re-caches the old build's 404s for the new chunk paths, and
# /_next/static carries a 30-day max-age — the failure that blanked pulse-staging on
# 22-07-2026.
#
# 🚨 NEVER use the dollar-brace variable form anywhere in this file — not in a command, not
# in a comment. Woodpecker substitutes over the RAW FILE, comments included, before the YAML
# is parsed. CI_COMMIT_SHA in the digest steps is the one deliberate exception.
#
# Secrets mount as a DIRECTORY: token-sync publishes with an atomic rename, and a
# single-FILE bind mount stays pinned to the inode that existed at container start — fatal
# for the 30m kube token.

# Routes this workflow to the in-cluster Kubernetes agent, which advertises
# `!runner=k8s` — a MANDATORY label, so the agent is only eligible when a task
# asks for it. Deleting this line sends the workflow back to the ci-ops Docker
# agent; that is the rollback, and it is one line.
labels:
  runner: k8s

depends_on:
  - push

when:
  - event: push
    branch: main
  - event: push
    branch: staging

steps:
  # ⚠️ The Accept list MUST include application/vnd.oci.image.manifest.v1+json.
  # kaniko INHERITS THE BASE IMAGE'S manifest media type, so the format varies
  # per REPO, not per tool. With an incomplete Accept the registry can fall back
  # to legacy schema1 and return a DIFFERENT DIGEST for the same tag — measured
  # 27-07-2026 — which would pin a Deployment to something that is not the image
  # that was built, with every gate still green.
  digest:
    image: alpine:3.20
    # Resources declared 29-07-2026 — without them the step pod is QoS BestEffort, first
    # evicted under node memory pressure. Estate-wide sweep after two pulse-backend steps
    # were SIGKILLed (exit 137) mid-download, presenting as a test failure (see
    # pulse-backend #147/#148). Sized by step class.
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 128Mi, cpu: 100m }
          limits: { memory: 512Mi }
    # registry.ops.ciphera.net resolves to the cluster's own NLB. A pod dialling
    # its own cluster's public load balancer hits the Exoscale NLB hairpin, and
    # ~1/node_count of those connections are black-holed. Pin the name at
    # Traefik's ClusterIP so the request never leaves the cluster.
    extra_hosts:
      - "registry.ops.ciphera.net:10.101.182.27"
    when:
      - event: push
        branch: main
    environment:
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - apk add --no-cache curl jq >/dev/null
      - export DEPLOY_SHA=${CI_COMMIT_SHA:0:7}
      - |
        DIGEST=$(curl -sfI --max-time 60 -u "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" \
          -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json" \
          "https://registry.ops.ciphera.net/v2/ciphera-net/pulse-frontend/manifests/sha-$DEPLOY_SHA" \
          | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')
        case "$DIGEST" in
          sha256:*) ;;
          *) echo "digest resolution failed for sha-$DEPLOY_SHA (got [$DIGEST]) — did push finish?"; exit 1 ;;
        esac
        echo "$DIGEST"     > /woodpecker/digest
        echo "$DEPLOY_SHA" > /woodpecker/deploy_sha
      - echo "resolved sha-$DEPLOY_SHA -> $(cat /woodpecker/digest)"
  deploy-k8s:
    image: alpine:3.20
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 128Mi, cpu: 100m }
          limits: { memory: 512Mi }
    # registry.ops.ciphera.net resolves to the cluster's own NLB. A pod dialling
    # its own cluster's public load balancer hits the Exoscale NLB hairpin, and
    # ~1/node_count of those connections are black-holed. Pin the name at
    # Traefik's ClusterIP so the request never leaves the cluster.
    extra_hosts:
      - "registry.ops.ciphera.net:10.101.182.27"
    depends_on: [digest]
    when:
      - event: push
        branch: main
    # NO volume, deliberately — this is the whole point of running in-cluster.
    #
    # On ci-ops this step bind-mounted /opt/woodpecker/secrets:/run/ci:ro, a host
    # directory into which the agent's `token-sync` task republished a 30-minute
    # Vault-issued ServiceAccount token plus the SKS control-plane CA every 30s.
    # All of that existed only because CI ran OUTSIDE the cluster and had no
    # Kubernetes identity of its own.
    #
    # A step pod has one automatically: the kubelet projects a rotating token and
    # the API server's CA at /var/run/secrets/kubernetes.io/serviceaccount/, and
    # the API is reachable in-cluster at kubernetes.default.svc. So the token-sync
    # mechanism, the host mount and the Vault round trip all disappear, and the
    # credential is now bound to this pod instead of readable by anything sharing
    # a VM. Permissions come from the ci-deployer RoleBinding
    # (Infra/Kubernetes/workloads/_shared/ci-deployer.yaml), which binds
    # woodpecker-builds/default.
    environment:
      KUBE_API: https://kubernetes.default.svc
    commands:
      - apk add --no-cache curl jq >/dev/null
      - |
        DIGEST=$(cat /woodpecker/digest) || { echo "digest handoff missing"; exit 1; }
        DEPLOY_SHA=$(cat /woodpecker/deploy_sha) || { echo "deploy_sha handoff missing"; exit 1; }
        case "$DIGEST" in sha256:*) ;; *) echo "bad digest handoff [$DIGEST]"; exit 1 ;; esac
        [ -n "$DEPLOY_SHA" ] || { echo "empty deploy_sha handoff"; exit 1; }
        export DIGEST DEPLOY_SHA
      - |
        BODY=$(jq -nc \
          --arg img "registry.ops.ciphera.net/ciphera-net/pulse-frontend@$DIGEST" \
          --arg sha "$DEPLOY_SHA" \
          '{spec:{template:{metadata:{annotations:{"ciphera.net/deploy-sha":$sha}},
                            spec:{containers:[{name:"nextjs",image:$img}]}}}}')
        curl -fsS --max-time 30 --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt -X PATCH \
          -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
          -H "Content-Type: application/strategic-merge-patch+json" \
          -d "$BODY" \
          "$KUBE_API/apis/apps/v1/namespaces/apps/deployments/pulse-frontend?fieldManager=woodpecker-ci" >/dev/null
      # Convergence gate. status.replicas == updatedReplicas is the load-bearing clause:
      # availableReplicas sums across ALL ReplicaSets, so without it the gate passes while
      # an OLD pod is still serving and purge-cdn caches that build's 404s for 30 days.
      - |
        CONVERGED=no
        for i in $(seq 1 90); do
          S=$(curl -fsS --max-time 15 --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
            -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
            "$KUBE_API/apis/apps/v1/namespaces/apps/deployments/pulse-frontend") \
            || { echo "api read failed (iter $i) — retrying"; S=''; }
          echo "$S" | jq -e '
            ((.status.observedGeneration // 0) >= .metadata.generation)
            and ((.status.updatedReplicas // 0) == .spec.replicas)
            and ((.status.replicas // 0) == (.status.updatedReplicas // 0))
            and ((.status.availableReplicas // 0) == (.status.updatedReplicas // 0))' >/dev/null \
            && { echo "k8s rollout converged"; CONVERGED=yes; break; }
          echo "$S" | jq -e '.status.conditions[]? | select(.type=="Progressing" and .reason=="ProgressDeadlineExceeded")' >/dev/null \
            && { echo "k8s rollout FAILED (ProgressDeadlineExceeded)"; break; }
          sleep 4
        done
        if [ "$CONVERGED" != "yes" ]; then
          curl -fsS --max-time 15 --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
            -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
            "$KUBE_API/api/v1/namespaces/apps/pods" \
            | jq -r '.items[] | select(.metadata.name | startswith("pulse-frontend")) | "\(.metadata.name) \(.status.phase)"' || true
          echo "k8s rollout did NOT converge for pulse-frontend"
          exit 1
        fi
      - |
        O=$(curl -fsS --max-time 15 --retry 3 --retry-all-errors --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
          -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
          "$KUBE_API/apis/apps/v1/namespaces/apps/deployments/pulse-frontend")
        echo "$O" | jq -e \
          --arg img "registry.ops.ciphera.net/ciphera-net/pulse-frontend@$DIGEST" \
          --arg sha "$DEPLOY_SHA" '
          ([.spec.template.spec.containers[].name] == ["nextjs"])
          and ((.spec.template.spec.containers[] | select(.name=="nextjs") | .image) == $img)
          and (.spec.template.metadata.annotations["ciphera.net/deploy-sha"] == $sha)' >/dev/null \
          || { echo "POST-DEPLOY MISMATCH — running spec is not what we shipped:"; \
               echo "$O" | jq '{containers:[.spec.template.spec.containers[]|{name,image}], sha:.spec.template.metadata.annotations["ciphera.net/deploy-sha"]}'; exit 1; }
      - echo "Deployed pulse-frontend to SKS ($DEPLOY_SHA)"
  digest-staging:
    image: alpine:3.20
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 128Mi, cpu: 100m }
          limits: { memory: 512Mi }
    # registry.ops.ciphera.net resolves to the cluster's own NLB. A pod dialling
    # its own cluster's public load balancer hits the Exoscale NLB hairpin, and
    # ~1/node_count of those connections are black-holed. Pin the name at
    # Traefik's ClusterIP so the request never leaves the cluster.
    extra_hosts:
      - "registry.ops.ciphera.net:10.101.182.27"
    when:
      - event: push
        branch: staging
    environment:
      REGISTRY_USERNAME:
        from_secret: registry_username
      REGISTRY_PASSWORD:
        from_secret: registry_password
    commands:
      - apk add --no-cache curl jq >/dev/null
      - export DEPLOY_SHA=${CI_COMMIT_SHA:0:7}
      - |
        DIGEST=$(curl -sfI --max-time 60 -u "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" \
          -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.manifest.v1+json" \
          "https://registry.ops.ciphera.net/v2/ciphera-net/pulse-frontend-staging/manifests/sha-$DEPLOY_SHA" \
          | tr -d '\r' | awk 'tolower($1)=="docker-content-digest:"{print $2}')
        case "$DIGEST" in
          sha256:*) ;;
          *) echo "digest resolution failed for sha-$DEPLOY_SHA (got [$DIGEST]) — did push finish?"; exit 1 ;;
        esac
        echo "$DIGEST"     > /woodpecker/digest
        echo "$DEPLOY_SHA" > /woodpecker/deploy_sha
      - echo "resolved sha-$DEPLOY_SHA -> $(cat /woodpecker/digest)"
  deploy-k8s-staging:
    image: alpine:3.20
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 128Mi, cpu: 100m }
          limits: { memory: 512Mi }
    # registry.ops.ciphera.net resolves to the cluster's own NLB. A pod dialling
    # its own cluster's public load balancer hits the Exoscale NLB hairpin, and
    # ~1/node_count of those connections are black-holed. Pin the name at
    # Traefik's ClusterIP so the request never leaves the cluster.
    extra_hosts:
      - "registry.ops.ciphera.net:10.101.182.27"
    depends_on: [digest-staging]
    when:
      - event: push
        branch: staging
    # NO volume, deliberately — this is the whole point of running in-cluster.
    #
    # On ci-ops this step bind-mounted /opt/woodpecker/secrets:/run/ci:ro, a host
    # directory into which the agent's `token-sync` task republished a 30-minute
    # Vault-issued ServiceAccount token plus the SKS control-plane CA every 30s.
    # All of that existed only because CI ran OUTSIDE the cluster and had no
    # Kubernetes identity of its own.
    #
    # A step pod has one automatically: the kubelet projects a rotating token and
    # the API server's CA at /var/run/secrets/kubernetes.io/serviceaccount/, and
    # the API is reachable in-cluster at kubernetes.default.svc. So the token-sync
    # mechanism, the host mount and the Vault round trip all disappear, and the
    # credential is now bound to this pod instead of readable by anything sharing
    # a VM. Permissions come from the ci-deployer RoleBinding
    # (Infra/Kubernetes/workloads/_shared/ci-deployer.yaml), which binds
    # woodpecker-builds/default.
    environment:
      KUBE_API: https://kubernetes.default.svc
    commands:
      - apk add --no-cache curl jq >/dev/null
      - |
        DIGEST=$(cat /woodpecker/digest) || { echo "digest handoff missing"; exit 1; }
        DEPLOY_SHA=$(cat /woodpecker/deploy_sha) || { echo "deploy_sha handoff missing"; exit 1; }
        case "$DIGEST" in sha256:*) ;; *) echo "bad digest handoff [$DIGEST]"; exit 1 ;; esac
        [ -n "$DEPLOY_SHA" ] || { echo "empty deploy_sha handoff"; exit 1; }
        export DIGEST DEPLOY_SHA
      - |
        BODY=$(jq -nc \
          --arg img "registry.ops.ciphera.net/ciphera-net/pulse-frontend-staging@$DIGEST" \
          --arg sha "$DEPLOY_SHA" \
          '{spec:{template:{metadata:{annotations:{"ciphera.net/deploy-sha":$sha}},
                            spec:{containers:[{name:"nextjs",image:$img}]}}}}')
        curl -fsS --max-time 30 --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt -X PATCH \
          -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
          -H "Content-Type: application/strategic-merge-patch+json" \
          -d "$BODY" \
          "$KUBE_API/apis/apps/v1/namespaces/apps/deployments/pulse-frontend-staging?fieldManager=woodpecker-ci" >/dev/null
      # Convergence gate. status.replicas == updatedReplicas is the load-bearing clause:
      # availableReplicas sums across ALL ReplicaSets, so without it the gate passes while
      # an OLD pod is still serving and purge-cdn caches that build's 404s for 30 days.
      - |
        CONVERGED=no
        for i in $(seq 1 90); do
          S=$(curl -fsS --max-time 15 --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
            -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
            "$KUBE_API/apis/apps/v1/namespaces/apps/deployments/pulse-frontend-staging") \
            || { echo "api read failed (iter $i) — retrying"; S=''; }
          echo "$S" | jq -e '
            ((.status.observedGeneration // 0) >= .metadata.generation)
            and ((.status.updatedReplicas // 0) == .spec.replicas)
            and ((.status.replicas // 0) == (.status.updatedReplicas // 0))
            and ((.status.availableReplicas // 0) == (.status.updatedReplicas // 0))' >/dev/null \
            && { echo "k8s rollout converged"; CONVERGED=yes; break; }
          echo "$S" | jq -e '.status.conditions[]? | select(.type=="Progressing" and .reason=="ProgressDeadlineExceeded")' >/dev/null \
            && { echo "k8s rollout FAILED (ProgressDeadlineExceeded)"; break; }
          sleep 4
        done
        if [ "$CONVERGED" != "yes" ]; then
          curl -fsS --max-time 15 --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
            -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
            "$KUBE_API/api/v1/namespaces/apps/pods" \
            | jq -r '.items[] | select(.metadata.name | startswith("pulse-frontend-staging")) | "\(.metadata.name) \(.status.phase)"' || true
          echo "k8s rollout did NOT converge for pulse-frontend-staging"
          exit 1
        fi
      - |
        O=$(curl -fsS --max-time 15 --retry 3 --retry-all-errors --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
          -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
          "$KUBE_API/apis/apps/v1/namespaces/apps/deployments/pulse-frontend-staging")
        echo "$O" | jq -e \
          --arg img "registry.ops.ciphera.net/ciphera-net/pulse-frontend-staging@$DIGEST" \
          --arg sha "$DEPLOY_SHA" '
          ([.spec.template.spec.containers[].name] == ["nextjs"])
          and ((.spec.template.spec.containers[] | select(.name=="nextjs") | .image) == $img)
          and (.spec.template.metadata.annotations["ciphera.net/deploy-sha"] == $sha)' >/dev/null \
