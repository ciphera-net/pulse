# Routes to the in-cluster Kubernetes agent. `!runner=k8s` on that agent makes
# this label MANDATORY for it to be eligible, so a workflow WITHOUT it is
# ineligible everywhere now that the ci-ops Docker agent is gone — and an
# ineligible workflow queues PENDING FOREVER rather than failing. Silent, not
# loud: the pipeline simply never finishes.
labels:
  runner: k8s

when:
  - event: push
    branch: [main, staging]
  - event: pull_request

steps:
  test:
    image: node:22
    # Resources declared 29-07-2026 — without them the step pod is QoS BestEffort, first
    # evicted under node memory pressure. Estate-wide sweep after two pulse-backend steps
    # were SIGKILLed (exit 137) mid-download, presenting as a test failure (see
    # pulse-backend #147/#148). Sized by step class.
    backend_options:
      kubernetes:
        resources:
          requests: { memory: 1Gi, cpu: 500m }
          limits: { memory: 4Gi }
    environment:
      NPM_READ_TOKEN:
        from_secret: npm_read_token
    commands:
      - export NODE_AUTH_TOKEN="$NPM_READ_TOKEN"
      - npm ci
      # 🔴 05-09-2026 — THE BUDGET NOW BLOCKS A MERGE, WHICH IT NEVER DID.
      # scripts/build-scripts.mjs has enforced GZIP_BUDGET (3072 B) since it was
      # written, but it runs from `prebuild`, and `npm run build` runs only in
      # push.yml's next-build step — which is gated `event: push, branch: [main,
      # staging]`. So the budget could red MAIN and could never stop the merge that
      # caused it. This line is what makes the ceiling real, and the published
      # "under 3 KB gzipped" claim honest.
      #
      # It also pins public/script.js, which is now BUILT from tracker/script.js
      # rather than hand-edited: the deploy step is bare alpine with no node, so the
      # built bytes have to be committed for it to upload them. Same contract as
      # script-sri.json below — the gate FAILS rather than fixes, because a step
      # that regenerates and carries on leaves the wrong bytes in the commit and
      # still reports green.
      - git ls-files --error-unmatch public/script.js public/script.debug.js public/script-versions.json
      - npm run build:scripts
      - git diff --exit-code public/script.js public/script.debug.js public/script-versions.json
      # 🔴 public/script-sri.json is DERIVED from public/script.js, and until now
      # NOTHING made them agree at commit time. On 26-08-2026 commit e2c98da1
      # edited script.js without regenerating the manifest, leaving a hash in git
      # that did not describe the file it names; it was corrected by accident two
      # commits later, when script.js happened to change again.
      #
      # No customer was exposed and that is worth stating precisely, so nobody
      # later mistakes this for a live-outage guard: both serving paths recompute
      # the hash from the real bytes at build/deploy time, and the customer embed
      # snippet pins `integrity` against script-versions.json, NOT this file.
      # The gate exists so a committed integrity hash cannot quietly lie —
      # before some future consumer starts trusting it.
      #
      # It FAILS rather than fixes. A step that regenerates and carries on would
      # leave the wrong hash in the commit and still report green.
      #
      # The ls-files line is the gate on the gate: if this file were ever
      # gitignored or untracked, `git diff --exit-code` would return 0 forever
      # and the check would pass by never looking at anything.
      - git ls-files --error-unmatch public/script-sri.json
      - npm run generate:sri
      - git diff --exit-code public/script-sri.json
      # Types are ALREADY a gate — `next build` fails on them and has no
      # `typescript.ignoreBuildErrors` — but that gate lives in the image build,
      # which runs only on push to main/staging. So a type error used to pass
      # every PR check and then break the DEPLOY build after merge. This moves the
      # same gate in front of the merge; it adds no new failure mode, only an
      # earlier one. Runs before `npm test` because it is the cheaper signal.
      # (That build was in build.yml until 20-08-2026; build.yml was a discarded
      # `dry-run` duplicate and was deleted, so the gate now lives in push.yml.
      # The reasoning is unchanged — push.yml is still push-only, so this step is
      # still the ONLY type gate a pull request gets.)
      - npm run type-check
      - npm test
      # 🔴 The date-sensitive suites, a SECOND time, under a maximal POSITIVE
      # offset (Pacific/Kiritimati, UTC+14). vitest.setup.ts pins
      # America/New_York, which catches a date rendered a day EARLY but is blind
      # to the opposite sign — and the opposite sign is the defect that reached a
      # customer on 15-08-2026 (a 23:24Z renewal date shown as the NEXT day). One
      # pinned sign is half a guard, and the half that was missing is the half
      # that shipped.
      - npm run test:tz-positive
